e h3{font-size:14px;line-height:1.4;margin:10px 0 3px}.movie p{font-size:12px;margin:0;color:#9faabd}.tag{position:absolute;bottom:10px;left:10px;background:#e1ed8e;color:#18210f;font-weight:750;padding:5px 8px;border-radius:6px;font-size:10px}.view{display:none}.view.active{display:block}.panel{background:#161e2b;border:1px solid #2b3545;border-radius:16px;padding:22px;margin:14px 0}.panel h3{margin-top:0}.diary{width:100%;border-collapse:collapse}.diary td,.diary th{text-align:left;padding:13px;border-bottom:1px solid #2b3545}.diary th{color:#aab7c7;font-size:12px}.diary td{font-size:14px}.back{background:none;border:0;color:#d9ed80;cursor:pointer;padding:0 0 24px}.detail-layout{display:grid;grid-template-columns:220px 1fr;gap:30px}.detail-layout .poster{width:100%}.details h2{font-size:36px;margin:0 0 8px}.meta{color:#9ba8ba;line-height:1.8}.edition{padding:12px;border:1px solid #354052;border-radius:10px;margin:8px 0}.empty{color:#aeb8c8;padding:30px}.note{font-size:12px;color:#8e9aab;margin-top:20px}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.detail-layout{grid-template-columns:1fr}.detail-layout .poster{max-width:230px}.diary td:nth-child(3),.diary th:nth-child(3){display:none}header{padding:18px 20px}main{padding:22px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}

/* V2 — refined, cinematic archive with Letterboxd-style browsing */

.hero-copy{font-size:14px;max-width:540px;line-height:1.8;color:#aaa7a0}.hero-bottom{margin-top:36px;display:flex;gap:16px;align-items:center;color:#a69b87;font-size:10px;letter-spacing:2px;font-weight:700}.hero-bottom span:last-child{font-size:20px;line-height:10px}

/* V4 — actual film posters */
.poster{padding:0;display:block;background:linear-gradient(145deg,var(--a),#1c2235 75%)}
.poster:before{display:none}.poster img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}.poster .poster-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}.poster .poster-placeholder b{font-size:clamp(16px,1.7vw,23px)}.poster .tag{z-index:2}.poster-settings{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#161e2b;border:1px solid #2b3545;border-radius:12px;padding:13px 15px;margin:0 0 20px}.poster-settings input{background:#101723;border:1px solid #354052;border-radius:8px;color:#fff;padding:9px 12px;min-width:200px;flex:1}.poster-settings button{background:#d9ed80;border:0;border-radius:8px;padding:10px 13px;color:#18210f;font-weight:700;cursor:pointer}.poster-settings small{color:#a7b2c3}.poster-settings a{color:#d9ed80}

/* V6: compact Excel-inspired film detail layout */
.film-detail-grid{display:grid;grid-template-columns:minmax(135px,185px) minmax(0,1fr);gap:26px;align-items:start}
.film-detail-grid .poster{width:100%;max-width:185px}
.film-detail-grid .details h2{font-family:Georgia,serif;font-size:clamp(28px,3vw,43px);line-height:1.15;margin:0 0 10px}
.film-kicker{font-size:10px;letter-spacing:2.1px;color:#d9ed80;font-weight:800;margin-bottom:12px}
.film-detail-grid .meta{line-height:1.8}
.film-facts{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.film-fact{background:#192333;border:1px solid #334054;border-radius:7px;padding:8px 11px;font-size:12px;color:#d5deec}
.film-rating-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.film-rating-row .stat{margin:0;padding:15px 12px}.film-rating-row .stat strong{font-size:26px}
.film-detail-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:22px}
.film-detail-sections .panel{margin:0}.film-detail-sections h3,.film-cast h3{font-family:Georgia,serif;font-size:23px}
.film-cast{margin-top:22px}.film-cast-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:15px;margin-top:16px}
.cast-card{min-width:0}.cast-photo{width:100%;aspect-ratio:3/4;border-radius:8px;background:linear-gradient(135deg,#283448,#121927);border:1px solid #334052;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aebed0;font-size:31px}
.cast-photo img{width:100%;height:100%;object-fit:cover}.cast-name{font-weight:650;font-size:12px;line-height:1.4;margin-top:8px}.cast-role{font-size:11px;color:#97a5b8;margin-top:3px}
.cast-toggle{background:#202c3e;border:1px solid #3a4a60;color:#d9ed80;border-radius:7px;padding:9px 12px;cursor:pointer;font-size:12px}
@media(max-width:760px){.film-detail-grid{grid-template-columns:112px minmax(0,1fr);gap:16px}.film-detail-grid .poster{max-width:112px}.film-detail-grid .details h2{font-size:26px}.film-rating-row{gap:6px}.film-rating-row .stat{padding:11px 8px}.film-rating-row .stat strong{font-size:22px}.film-detail-sections{grid-template-columns:1fr}.cast-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}

/* V7 — compact physical editions, prominent watch status and clearer language */
.film-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:19px 0 4px}
.film-fact{display:flex;flex-direction:column;justify-content:center;min-height:74px;padding:12px 14px;border:1px solid #3b4c61;border-radius:10px;background:#1a2738;color:#f0f4f8;font-size:18px;font-weight:750;line-height:1.3}
.film-fact .fact-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#9eafc3;font-weight:700;margin-bottom:7px}
.film-fact.is-seen{border-color:#536743;background:#253224;color:#d9ed80}
.film-fact .fact-date{font-size:15px}
.film-detail-sections{gap:12px;margin-top:12px}
.film-detail-sections .panel{padding:14px 16px}
.film-detail-sections h3{font-family:inherit;font-size:15px;font-weight:750;margin:0 0 11px}
.film-detail-sections .edition{padding:9px 10px;margin:6px 0;font-size:12px;line-height:1.5;background:#121a26}
.film-detail-sections .edition .muted{font-size:11px}
.film-languages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:13px}
.film-language{background:#1b293b;border:1px solid #384a61;border-radius:9px;padding:13px 15px;min-width:0}
.film-language-label{display:block;color:#aabbd0;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:750;margin-bottom:6px}
.film-language-value{display:block;color:#f2f6fb;font-size:15px;font-weight:700;overflow-wrap:anywhere}
@media(max-width:760px){.film-facts{grid-template-columns:1fr;gap:7px}.film-fact{min-height:57px;padding:10px 12px;font-size:16px}.film-languages{grid-template-columns:1fr}}

/* V8: watch tracking and compact language position */
.film-languages{margin:18px 0 4px}.detail-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 22px}.detail-topbar .back{padding:0}.watched-button{background:#d9ed80;color:#182016;border:0;border-radius:8px;padding:16px 26px;font-size:14px;letter-spacing:.8px;font-weight:850;cursor:pointer}.watched-button:hover{filter:brightness(1.07)}.watch-dialog{position:fixed;inset:0;z-index:100;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px}.watch-dialog[hidden]{display:none}.watch-card{background:#182233;border:1px solid #455269;border-radius:15px;padding:24px;width:min(430px,100%);box-shadow:0 30px 90px #0009}.watch-card h3{margin:0 0 10px;font-size:22px}.watch-card label{display:block;font-size:12px;color:#b5c5d7;margin:15px 0 5px}.watch-card input,.watch-card select{display:block;width:100%;box-sizing:border-box;background:#101723;border:1px solid #455269;border-radius:8px;color:#fff;padding:11px;font-size:14px}.watch-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.watch-actions button,.export-watches{border-radius:8px;padding:10px 13px;border:1px solid #455269;background:#26354b;color:#fff;cursor:pointer}.watch-actions button.primary{background:#d9ed80;color:#182016;font-weight:800;border-color:#d9ed80}.export-watches{margin:10px 0 18px}.watch-note{color:#a9b9ca;font-size:12px;line-height:1.5}.watch-toast{font-size:12px;color:#d9ed80;margin-top:8px}@media(max-width:640px){.detail-topbar{align-items:flex-start}.watched-button{padding:14px 18px;font-size:13px}}
.test-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.test-tools .export-watches{margin:0}.test-tools .danger{color:#ffb7b7;border-color:#8d4a50}.test-tools .danger:hover{background:#532b33}
/* Versie 13: Excel-geïnspireerde kijkgeschiedenis met kalendermaanden en filmposters */
.diary-panel{padding:12px 18px;overflow-x:auto}
.diary-calendar{width:100%;border-collapse:collapse;table-layout:fixed}
.diary-calendar th{font-size:11px;letter-spacing:.4px;text-align:left;padding:10px 12px;color:#aeb9c8}
.diary-calendar th:nth-child(1){width:120px}.diary-calendar th:nth-child(2){width:55px;text-align:center}.diary-calendar th:nth-child(3){width:59px}.diary-calendar th:nth-child(5){width:95px}.diary-calendar th:nth-child(6){width:130px}.diary-calendar th:nth-child(7){width:210px}
.diary-calendar td{height:66px;padding:5px 12px;vertical-align:middle;border-bottom:1px solid #303b4c;font-size:14px}
.diary-calendar .diary-month-cell{padding:4px 8px 4px 0;vertical-align:top}
.diary-month{background:#253348;border:1px solid #3e526c;border-radius:6px;padding:9px 5px;min-height:56px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px}
.diary-month strong{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#e5f5c1}.diary-month span{font-size:13px;font-weight:750;color:#f3f6fc}
.diary-calendar .diary-day{text-align:center;font-size:18px;font-weight:700;color:#f0f4fb}
.diary-calendar .diary-poster-cell{padding:4px 6px}
.diary-poster{position:relative;width:36px;height:54px;border-radius:3px;overflow:hidden;background:linear-gradient(155deg,var(--a,#35425a),#151b28);border:1px solid #465167;display:flex;align-items:center;justify-content:center}
.diary-poster span{font-size:7px;text-align:center;line-height:1.2;padding:3px;overflow-wrap:anywhere;color:#fff}
.diary-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.diary-poster-empty{font-size:18px}
.diary-calendar .diary-film{font-size:15px;font-weight:650;color:#f0f3f8}
/* Maandwissels blijven herkenbaar aan het kalenderblok, zonder extra dikke lijn. */
.diary-calendar .diary-film-year{font-size:13px;color:#91a3b8;font-weight:500;white-space:nowrap;margin-left:7px}
.diary-calendar .diary-format{color:#d5e1ef}.diary-calendar .diary-rating{font-weight:700}
.diary-calendar .diary-edition{color:#b9c8d9;font-size:13px;overflow-wrap:anywhere}
@media(max-width:720px){.diary-panel{padding:6px;overflow-x:auto}.diary-calendar{min-width:620px}.diary-calendar td{height:64px}.diary-calendar .diary-film{font-size:13px}}

/* V15: verfijnde kijkgeschiedenis */
.diary-calendar th:nth-child(5){width:94px}
.diary-calendar th:nth-child(6){width:126px}
.diary-calendar th:nth-child(7){width:112px}
.diary-calendar th:nth-child(8){width:205px}

.diary-calendar .diary-format,.diary-calendar .diary-edition{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.22px;font-weight:550}
.diary-calendar .diary-format{color:#e1e8f2;font-size:13px}
.diary-calendar .diary-edition{color:#b9c8d9;font-size:13px;line-height:1.4}
@media(max-width:900px){.diary-calendar{min-width:980px}}

/* V17: collectie en kijkgeschiedenis verfijningen */
#collection>.stats{margin-top:22px}
#count{display:inline-flex;align-items:center;gap:5px;background:#1c2a3b;border:1px solid #40546a;border-radius:9px;padding:10px 15px;color:#e4ebf3;font-size:14px;font-weight:650;margin:14px 0 22px}
#count strong{color:#d9ed80;font-size:19px;font-weight:650}
.diary-film-link{font:inherit;font-weight:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;line-height:1.45}
.diary-film-link:hover{color:#d9ed80;text-decoration:underline;text-underline-offset:3px}
.diary-film-link:focus-visible{outline:2px solid #d9ed80;outline-offset:4px;border-radius:2px}
.diary-film-link .diary-film-year{pointer-events:none}

.film-fact.history-link{cursor:pointer;transition:border-color .15s,background .15s}
.film-fact.history-link:hover{border-color:#d9ed80;background:#26364a}
.film-fact.history-link:focus-visible{outline:2px solid #d9ed80;outline-offset:3px}
.film-rating-row .rating-link{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:inherit;cursor:pointer}
.film-rating-row .rating-link:hover{border-color:#d9ed80;background:#25364a}
.rating-logo{font-size:12px;font-weight:800;letter-spacing:.3px}

</style></head><body><header><div><h1><span class="brand-mark">🎞️</span><span class="brand-word">FILM <em>COLLECTIE</em></span></h1><small>Mijn persoonlijke filmcollectie, op één plek</small></div><nav><button id="navCollection" class="active">Collectie</button></nav></header><main><section id="publicCollection"><div class="public-intro"><h2>Mijn filmcollectie.</h2><p>Een overzicht van mijn films en fysieke uitgaven.</p></div><div class="toolbar"><input id="search" placeholder="Zoek op film, regisseur of acteur…" aria-label="Zoeken"><select id="genre" aria-label="Genre"><option value="">Alle genres</option></select><select id="format" aria-label="Formaat"><option value="">Alle formaten</option><option value="4K">4K</option><option value="Blu-ray">Blu-ray</option></select><select id="sort" aria-label="Sortering"><option value="title">Titel A–Z</option><option value="year">Jaar (nieuwste)</option></select></div><p id="count" class="muted"></p><div class="grid" id="movies"></div></section><section id="publicDetail" class="public-detail" hidden><button class="back" id="back">← Terug naar collectie</button><div id="detailBody"></div></section><footer class="public-footer">Openbare filmcollectie · Alleen-lezen · Filmgegevens worden geladen vanuit Supabase. Posters volgen later.</footer></main><script>
const SUPABASE_URL = 'https://jfgojgbyorumeefgzvwd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EB27kcAdGy--KkcL6wl-cw__yJqVSJR';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title = s => String(s || '').replace(/\b[\p{L}]/gu, x => x.toUpperCase());
const sortKey = s => String(s || '').replace(/^(the|an|a)\s+/i, '').toLowerCase();
let FILMS=[];
const headers={apikey:SUPABASE_KEY,Accept:'application/json'};
async function getAll(table){
  const all=[]; const pageSize=500;
  for(let offset=0;offset<10000;offset+=pageSize){
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*&order=id.asc&limit=${pageSize}&offset=${offset}`,{headers});
    if(!res.ok)throw new Error(`${table}: HTTP ${res.status} — ${await res.text()}`);
    const rows=await res.json();all.push(...rows);
    if(rows.length<pageSize)break;
  }
  return all;
}
function render(){
  const q=$('search').value.trim().toLowerCase(),g=$('genre').value,fmt=$('format').value;
  const arr=FILMS.filter(f=>(!q||[f.title,f.director,f.cast].join(' ').toLowerCase().includes(q))&&(!g||String(f.genres).split('|').map(x=>x.trim()).includes(g))&&(!fmt||f.editions.some(e=>String(e.format).toLowerCase().includes(fmt.toLowerCase()))));
  arr.sort((a,b)=>$('sort').value==='year'?(Number(b.year)-Number(a.year)||sortKey(a.title).localeCompare(sortKey(b.title))):sortKey(a.title).localeCompare(sortKey(b.title)));
  $('count').textContent=arr.length+' films gevonden';
  const frag=document.createDocumentFragment();
  for(const f of arr){
    const card=document.createElement('article');card.className='movie';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',title(f.title));
    card.innerHTML='<div class="poster" style="--a:#24364a"><div class="public-poster"><b>'+esc(title(f.title))+'</b></div></div><h3>'+esc(title(f.title))+'</h3><p>'+esc(f.year)+'</p>';
    card.onclick=()=>showFilm(f);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showFilm(f)}};frag.append(card);
  }
  $('movies').replaceChildren(frag);
}
function showFilm(f){
  $('publicCollection').hidden=true;$('publicDetail').hidden=false;
  $('detailBody').innerHTML='<div class="detail-layout"><div class="poster" style="--a:#24364a"><div class="public-poster"><b>'+esc(title(f.title))+'</b></div></div><div class="details"><h2>'+esc(title(f.title))+' <span class="muted">('+esc(f.year)+')</span></h2><p class="public-meta">'+esc(f.director)+' · '+esc(f.genres)+' · '+esc(f.runtime)+' min</p><div class="panel"><h3>Fysieke uitgaven</h3>'+(f.editions.length?f.editions.map(e=>'<div class="edition"><strong>'+esc(e.format)+'</strong> · '+esc(e.edition)+' · '+esc(e.label)+(e.title&&e.title!==f.title?' · '+esc(title(e.title)):'')+'</div>').join(''):'Geen uitgaven gevonden')+'</div><div class="panel"><h3>Overige informatie</h3><p>Taal: '+esc(f.language||'—')+' · Ondertiteling: '+esc(f.subtitles||'—')+'</p><p>IMDb: '+esc(f.imdb||'—')+' · Letterboxd: '+esc(f.letterboxd||'—')+'</p></div></div></div>';
  window.scrollTo(0,0);
}
function back(){$('publicDetail').hidden=true;$('publicCollection').hidden=false;window.scrollTo(0,0)}
$('back').onclick=back;$('navCollection').onclick=back;
['search','genre','format','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
async function init(){
  $('count').textContent='Films laden vanuit Supabase…';
  try{
    const [films,editions]=await Promise.all([getAll('films'),getAll('editions')]);
    const byId=new Map(films.map(f=>[Number(f.id),{title:f.title,year:f.release_year,director:f.director,genres:f.genres,cast:f.cast_members,runtime:f.runtime,language:f.language,subtitles:f.subtitles,imdb:f.imdb_rating,letterboxd:f.letterboxd_rating,editions:[]}]));
    for(const e of editions){const film=byId.get(Number(e.film_id));if(film)film.editions.push(e)}
    FILMS=[...byId.values()];
    const genres=new Set();FILMS.forEach(f=>String(f.genres||'').split('|').forEach(g=>{if(g.trim())genres.add(g.trim())}));
    [...genres].sort().forEach(g=>{$('genre').insertAdjacentHTML('beforeend','<option>'+esc(g)+'</option>')});
    render();
  }catch(err){console.error(err);$('count').textContent='Kon de films niet laden. Controleer de Supabase-toegang en RLS-instellingen.';$('movies').textContent='Fout: '+err.message;}
}
init();
